name: Feed git-pal

on:
  schedule:
    - cron: '17 6 * * *' # once a day
  workflow_dispatch: # adds a "Run workflow" button

permissions:
  contents: write

jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: mochiicakes/git-pals@v1
        with:
          pet_name: Pal